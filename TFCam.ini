[FOV]

; Degrees per mouse wheel tick
fStep=5.0000

; FOV range limits
fMin=10.0
fMax=150.0


[Roll]

; Radians per second while key held
fSpeed=1.6000

; Q = roll counter-clockwise (0x10 = 16)
iKeyCCW=16

; E = roll clockwise (0x12 = 18)
iKeyCW=18


[Hotkeys]

; DX scancode for free fly toggle (0 = unmapped)
iFreeFlyKey=0

; DX scancode for freeze camera in place (0 = unmapped)
iFreezeCamKey=0

; R = reset FOV + roll (0x13 = 19)
iResetKey=19
iFreezeTimeKey=0
iScreenshotKey=0

; Hold to fly at 1/5 speed. DX scancode, 0x38 = Left Alt (56). 0 = off
iSlowKey=56


[Camera]

; --Claude: fly free-cam around the character while RaceMenu is open (WASD move, hold Left Alt to look). 1=on
bRaceMenuCamera=1
fSpeed=14.5000
bHideHUD=1
bBlockAttacks=1
iLMBAction=0
iRMBAction=0

; 1 = in free cam Shift no longer drives sprint / run / run toggle (incl. a Shift+key run toggle). 0 = works as without TFCam
bDisableShift=0
; 1 = Space / Jump does nothing in free cam (no jumping under the camera, any key or gamepad). 0 = works as without TFCam
bDisableSpace=1
; 1 = eat the Activate key (E / gamepad A) while in free cam: no sitting on furniture or using a door the camera points at
bDisableActivate=1


[Light]
bScrollBrightness=1
bScrollRadius=1
fRadius=1000.0000
fFade=1.7000
iColorR=215
iColorG=233
iColorB=255
